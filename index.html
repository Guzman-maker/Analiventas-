<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RutaVentas">
<title>RutaVentas</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css">
<style>
/* ===== Tokens de color (claro/oscuro) — cambia aquí la paleta ===== */
:root{--bg:#f1f5f4;--card:#fff;--ink:#0d2326;--mut:#5b7074;--pri:#0f766e;--acc:#f59e0b;--bd:#d9e2e1;--bad:#c0392b;--ok:#15803d;color-scheme:light}
:root[data-t=dark]{--bg:#0b1a1d;--card:#12272b;--ink:#e6f0ef;--mut:#8aa3a6;--pri:#2dd4bf;--bd:#223c41;--bad:#f0776a;--ok:#4ade80;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:860px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 14px 110px}
h2{font-size:1.35rem;margin:6px 0 12px}h3{margin:0 0 8px;font-size:1.05rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
.stat small{color:var(--mut);display:block}.stat b{font-size:1.2rem}
.mut{color:var(--mut)}.pad{padding:20px}.sm{font-size:.85rem}.bad{color:var(--bad)}.ok{color:var(--ok)}
label{display:block;font-size:.85rem;color:var(--mut);margin-bottom:10px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-top:4px}
input[type=checkbox]{width:auto;margin-right:8px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{font:inherit;font-weight:600;border:1px solid var(--bd);background:var(--card);color:var(--ink);padding:10px 14px;border-radius:10px;cursor:pointer;margin:0 6px 6px 0}
.btn.p{background:var(--pri);color:#fff;border-color:var(--pri)}:root[data-t=dark] .btn.p{color:#04201d}
.btn.d{color:var(--bad)}.btn.s{padding:6px 10px;font-size:.85rem}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--bd);border-radius:99px;padding:6px 12px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}:root[data-t=dark] .chip.on{color:#04201d}
.tag{font-size:.72rem;border-radius:6px;padding:1px 6px;margin-right:6px;border:1px solid var(--bd)}
.tag.dato{background:#d1fae5;color:#065f46}.tag.est{background:#fef3c7;color:#92400e}.tag.demo{background:#e0e7ff;color:#3730a3}
.li{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}.li:last-child{border:0}
.banner{background:#fef3c7;color:#92400e;border-radius:10px;padding:10px;margin-bottom:12px;font-size:.9rem}
#map,.map{height:320px;border-radius:14px;border:1px solid var(--bd);margin-bottom:14px;position:relative;z-index:0;isolation:isolate;overflow:hidden}
.maplibregl-map{font:inherit}.maplibregl-canvas{max-height:none}
.maplibregl-popup-content{color:#0d2326;font:inherit;border-radius:10px}
.me-dot{width:18px;height:18px;border-radius:50%;background:#2563eb;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.zpin{min-width:28px;height:28px;padding:0 6px;border-radius:8px;background:var(--pri);color:#fff;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem}
.zr{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd);cursor:pointer}.zr:last-child{border:0}
.zn{flex:none;width:28px;height:28px;border-radius:8px;background:var(--pri);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
.zb{flex:1;min-width:0}.zt{display:flex;justify-content:space-between;gap:8px}.zt b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zbar{height:6px;border-radius:4px;background:var(--bd);margin:5px 0;overflow:hidden}.zbar i{display:block;height:100%;background:var(--pri);border-radius:4px}
.pin{width:28px;height:28px;border-radius:50%;background:var(--acc);color:#1b1200;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.8rem;cursor:pointer}
.pin .lbl{display:none;position:absolute;left:100%;top:50%;transform:translateY(-50%);margin-left:5px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:rgba(255,255,255,.95);color:#0d2326;font-weight:600;font-size:.72rem;padding:1px 6px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.3);pointer-events:none}
.zl .pin .lbl{display:block}
canvas{max-height:220px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:2000}
nav button{background:none;border:0;color:var(--mut);font:inherit;font-size:.75rem;padding:6px 0;cursor:pointer}
nav button.on{color:var(--pri);font-weight:700}
nav .fab{width:58px;height:58px;border-radius:50%;background:var(--acc);color:#1b1200;font-size:2rem;font-weight:700;margin:-30px auto 0;border:4px solid var(--card);box-shadow:0 4px 12px rgba(0,0,0,.3);display:block;line-height:1;padding:0}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:3000;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:4000;display:none;max-width:90%}
#toast.e{background:var(--bad);color:#fff}
textarea.sql{height:140px;font:12px/1.3 ui-monospace,monospace}
@media(prefers-reduced-motion:no-preference){.sheet>div{animation:up .18s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.5}}}
</style>
</head>
<body>
<main id="v"><p class="mut pad">Cargando…</p></main>
<nav>
 <button data-a="go" data-v="home">Inicio</button>
 <button data-a="go" data-v="sales">Ventas</button>
 <button class="fab" data-a="newsale" aria-label="Registrar venta">+</button>
 <button data-a="go" data-v="route">Ruta</button>
 <button data-a="go" data-v="more">Más</button>
</nav>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
"use strict";
/* ================= UTILIDADES ================= */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c=='x'?r:r&3|8).toString(16)});
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:NaN};
const sum=(a,f)=>a.reduce((t,x)=>t+f(x),0);
const $m=n=>'$'+(+n||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
const day=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fdt=t=>new Date(t).toLocaleString('es-MX',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
const dur=ms=>{const m=Math.round(ms/60000);return m>=60?Math.floor(m/60)+' h '+m%60+' min':m+' min'};
const km=m=>m>=1000?(m/1000).toFixed(2)+' km':Math.round(m)+' m';
const DAYS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const hav=(a,b)=>{const R=6371e3,r=x=>x*Math.PI/180,dl=r(b.lat-a.lat),dg=r(b.lng-a.lng);const h=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
let tt;function toast(m,e){const t=$('#toast');t.textContent=m;t.className=e?'e':'';t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',3200)}
function sheet(h){closeSheet();const d=document.createElement('div');d.className='sheet';d.id='sh';d.innerHTML='<div>'+h+'</div>';d.addEventListener('click',e=>{if(e.target===d)closeSheet()});document.body.appendChild(d)}
function closeSheet(){const s=$('#sh');if(s)s.remove()}
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove()}

/* ================= ESTADO + localStorage ================= */
const KEY='rutaventas.v1';
const blank=()=>({products:[],sales:[],routes:[],events:[],del:[],active:null,wx:null,
 cfg:{place:'Lázaro Cárdenas, Michoacán',lat:17.958,lng:-102.2,url:'',key:'',theme:'auto',last:''}});
let S=(()=>{try{const o=JSON.parse(localStorage.getItem(KEY)||'null');if(!o)return blank();const b=blank();return Object.assign(b,o,{cfg:Object.assign(b.cfg,o.cfg||{})})}catch(e){return blank()}})();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('No se pudo guardar localmente: '+e.message,1)}}
const ar=()=>S.routes.find(r=>r.id===S.active);
/* Si la página se recargó con una ruta activa, queda en pausa (el GPS no sigue solo) */
(()=>{const r=ar();if(r&&r.status==='tracking'){const l=r.pts[r.pts.length-1];r.acc+=(l?l.t:r.seg)-r.seg;r.status='paused';save()}})();

/* ================= TEMA + PWA ================= */
function theme(){const t=S.cfg.theme;document.documentElement.dataset.t=t==='auto'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):t}
theme();
(()=>{ /* Manifest en blob + icono generado: instalación básica sin archivos extra */
 try{const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');x.fillStyle='#0f766e';x.fillRect(0,0,180,180);x.fillStyle='#f59e0b';x.font='bold 84px system-ui';x.textAlign='center';x.textBaseline='middle';x.fillText('RV',90,96);
 const ic=c.toDataURL('image/png');const l=document.createElement('link');l.rel='apple-touch-icon';l.href=ic;document.head.appendChild(l);
 const mf={name:'RutaVentas',short_name:'RutaVentas',display:'standalone',start_url:location.href.split('#')[0],background_color:'#0b1a1d',theme_color:'#0f766e',icons:[{src:ic,sizes:'180x180',type:'image/png'}]};
 const m=document.createElement('link');m.rel='manifest';m.href=URL.createObjectURL(new Blob([JSON.stringify(mf)],{type:'application/manifest+json'}));document.head.appendChild(m)}catch(e){}
})();

/* ================= CÁLCULOS ================= */
let R={k:'week',from:'',to:''}; /* rango del dashboard */
function rng(){const n=new Date(),d0=new Date(n.getFullYear(),n.getMonth(),n.getDate());
 if(R.k==='today')return[+d0,+d0+864e5];
 if(R.k==='week'){const s=new Date(d0);s.setDate(s.getDate()-((s.getDay()+6)%7));return[+s,+s+7*864e5]}
 if(R.k==='month')return[+new Date(n.getFullYear(),n.getMonth(),1),+new Date(n.getFullYear(),n.getMonth()+1,1)];
 const a=R.from?+new Date(R.from+'T00:00'):+d0,b=R.to?+new Date(R.to+'T00:00')+864e5:+d0+864e5;return[a,Math.max(b,a+864e5)]}
const inR=(a,b)=>S.sales.filter(s=>s.ts>=a&&s.ts<b);
function stat(L){const inc=sum(L,s=>s.total),cost=sum(L,s=>s.cost*s.qty),by={};
 L.forEach(s=>by[s.name]=(by[s.name]||0)+s.qty);const top=Object.entries(by).sort((a,b)=>b[1]-a[1])[0];
 const ts=L.map(s=>s.ts).sort((a,b)=>a-b),g=[];for(let i=1;i<ts.length;i++){const d=ts[i]-ts[i-1];if(d<3*36e5)g.push(d)}
 return{n:L.length,inc,cost,pr:inc-cost,u:sum(L,s=>s.qty),top,gap:g.length?sum(g,x=>x)/g.length:null}}
/* Zonas: las ventas a ≤600 m del centro de una zona se agrupan en ella; se nombran con la calle/colonia (cache local) */
function zonesX(L){const cs=[];
 L.filter(s=>s.lat!=null&&s.lng!=null).slice().sort((a,b)=>a.ts-b.ts).forEach(s=>{
  let b=null,bd=1e9;cs.forEach(c=>{const d=hav(c,s);if(d<bd){bd=d;b=c}});
  if(b&&bd<=600){b.n++;b.inc+=s.total;b.sl+=s.lat;b.sg+=s.lng;b.lat=b.sl/b.n;b.lng=b.sg/b.n;b.pts.push(s)}
  else cs.push({lat:s.lat,lng:s.lng,sl:s.lat,sg:s.lng,n:1,inc:s.total,pts:[s]})});
 const t=sum(cs,c=>c.inc)||1;cs.sort((a,b)=>b.inc-a.inc);
 cs.forEach((c,i)=>{c.rank=i+1;c.share=c.inc/t;c.rad=Math.max(120,Math.min(800,Math.max(...c.pts.map(p=>hav(c,p)))+80))});return cs}
const GK='rv_geo_v1';let GEO={};try{GEO=JSON.parse(localStorage.getItem(GK)||'{}')}catch(e){}
const gkey=c=>c.lat.toFixed(3)+','+c.lng.toFixed(3),zname=c=>GEO[gkey(c)]||('Zona '+c.rank);
let geoBusy=false;
async function geoFill(zs){if(geoBusy)return;geoBusy=true;
 try{for(const c of zs){const k=gkey(c);if(GEO[k])continue;
  const r=await fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=17&accept-language=es&lat='+c.lat+'&lon='+c.lng);if(!r.ok)break;
  const j=await r.json(),a=j.address||{},road=a.road||a.pedestrian||a.residential||a.path,sub=a.neighbourhood||a.suburb||a.quarter||a.city_district||a.village;
  const nm=[road,sub].filter(Boolean).slice(0,2).join(', ')||(j.name||'');
  if(nm){GEO[k]=nm;try{localStorage.setItem(GK,JSON.stringify(GEO))}catch(e){}
   document.querySelectorAll('[data-zr="'+c.rank+'"]').forEach(el=>el.textContent=nm)}
  await new Promise(f=>setTimeout(f,1100))}}catch(e){}finally{geoBusy=false}}
const delta=(c,p)=>p?((c-p)/p*100>=0?'+':'')+((c-p)/p*100).toFixed(0)+'%':'—';
/* Calendario laboral MX. Descansos oficiales (Ley Federal del Trabajo, art. 74) calculados por regla; Semana Santa por cálculo de Pascua. */
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31);return new Date(y,mo-1,(h+l-7*m+114)%31+1)}
const nth=(y,m,w,n)=>{const d=new Date(y,m,1);d.setDate(1+((w-d.getDay()+7)%7)+(n-1)*7);return d};
function rest(d){const y=d.getFullYear(),k=x=>day(+x),L={};
 L[y+'-01-01']=['Año Nuevo','oficial'];L[k(nth(y,1,1,1))]=['Día de la Constitución','oficial'];L[k(nth(y,2,1,3))]=['Natalicio de Benito Juárez','oficial'];
 L[y+'-05-01']=['Día del Trabajo','oficial'];L[y+'-09-16']=['Independencia','oficial'];L[k(nth(y,10,1,3))]=['Revolución Mexicana','oficial'];L[y+'-12-25']=['Navidad','oficial'];
 if((y-2024)%6===0)L[y+'-10-01']=['Cambio de Poder Ejecutivo','oficial'];
 const e=easter(y);[[-3,'Jueves Santo'],[-2,'Viernes Santo']].forEach(([o,n])=>{const x=new Date(e);x.setDate(e.getDate()+o);L[k(x)]=[n,'tradicional']});
 return L[day(+d)]||null}
const SP={'02-14':'San Valentín','05-10':'Día de las Madres','11-02':'Día de Muertos','12-12':'Día de la Virgen de Guadalupe','12-24':'Nochebuena','12-31':'Fin de año'};
const spName=d=>SP[String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')]||'';
function flags(d){const f=[],dm=d.getDate(),last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(),w=d.getDay();
 if([14,15,16,last-1,last,1].includes(dm))f.push('quincena');if(w===0||w===6)f.push('fin de semana');
 if(dm<=3)f.push('inicio de mes');if(dm>=last-2)f.push('fin de mes');
 if(rest(d))f.push('día de descanso');
 if(w===6||w===0){const nx=new Date(d.getFullYear(),d.getMonth(),dm+(w===6?2:1)),r=rest(nx);if(r&&r[1]==='oficial')f.push('fin de semana largo')}
 if(spName(d))f.push('fecha especial');return f}
function histDays(){const bd={};S.sales.forEach(s=>{const k=day(s.ts);bd[k]=(bd[k]||0)+s.total});return Object.entries(bd).map(([k,v])=>({d:new Date(k+'T12:00:00'),v}))}
/* Pronóstico de un día: usa TUS datos si hay ≥3 días con esa condición; si no, es una estimación y se marca como tal */
function outlook(d,H){const f=flags(d),why=[],ratios=[];let sc=0,tip='';
 const base=H.length>=7?sum(H,x=>x.v)/H.length:null;
 f.forEach(k=>{const a=H.filter(x=>flags(x.d).includes(k));if(base&&a.length>=3){const r=sum(a,x=>x.v)/a.length/base;ratios.push(r);why.push('en tus '+a.length+' días de '+k+' vendiste '+Math.round(r*100)+'% de tu promedio')}});
 const src=ratios.length?'Dato':'Estimación';
 if(ratios.length)sc=(ratios.reduce((a,b)=>a+b,0)/ratios.length-1)*5;
 else{if(f.includes('día de descanso')){sc-=1;why.push('muchos trabajadores descansan, suele bajar la venta en zonas de oficinas o industria')}
  if(f.includes('quincena')){sc+=1;why.push('día de pago, suele haber más gasto')}
  if(f.includes('fin de semana largo'))why.push('fin de semana largo: más gente fuera de casa en zonas de paseo, menos en zonas de trabajo');
  else if(f.includes('fin de semana'))why.push('el efecto depende de tu zona; compáralo con tus datos');
  if(f.includes('fecha especial'))why.push(spName(d)+': puede cambiar la demanda')}
 const wx=S.wx&&S.wx.dp?S.wx.dp[day(+d)]:null;if(wx!=null&&wx>=60){sc-=.5;why.push('lluvia probable ('+wx+'% pico del día)')}
 const v=sc>=.8?'bueno':sc<=-.8?'flojo':'normal';
 tip=v==='bueno'?'Lleva más inventario y sal temprano.':v==='flojo'?'Lleva menos producto o prueba otra zona.':'Vende como de costumbre.';
 return{v,src,why:why.length?why.join('; ')+'.':'sin factores especiales.',tip}}
function olHtml(){const H=histDays(),n=new Date();let o='';
 for(let i=0;i<7;i++){const d=new Date(n.getFullYear(),n.getMonth(),n.getDate()+i,12),x=outlook(d,H),r=rest(d),f=flags(d),sp=spName(d);
  o+='<div class="li"><div><b>'+(i===0?'Hoy':DAYS[d.getDay()])+' '+d.getDate()+'/'+(d.getMonth()+1)+'</b>'+(r?' · '+r[0]:'')+(sp?' · '+sp:'')+'<br><span class="mut sm">'+(f.length?f.join(', ')+'. ':'')+x.why+(i===0?' <b>'+x.tip+'</b>':'')+'</span></div><div style="text-align:right;min-width:92px"><b class="'+(x.v==='bueno'?'ok':x.v==='flojo'?'bad':'')+'">'+(x.v==='bueno'?'Buen día':x.v==='flojo'?'Día flojo':'Normal')+'</b><br><span class="tag '+(x.src==='Dato'?'dato':'est')+'">'+x.src+'</span></div></div>'}
 return'<h3>Calendario de ventas</h3><p class="mut sm">Combina quincena, fines de semana, descansos oficiales (LFT art. 74), Semana Santa y lluvia. <b>Dato</b> = calculado con tus ventas (solo días con ventas registradas); <b>Estimación</b> = regla general hasta tener ≥3 días comparables. Verifica los festivos en el calendario oficial.</p>'+o}

const wxRain=()=>S.wx&&Date.now()-S.wx.t<3*36e5?S.wx.prec>0:null;

/* ================= RECOMENDACIONES (reglas y estadística simple, NO IA) ================= */
function recs(){const A=S.sales,o=[],T=(t,x)=>o.push({t,x}),now=Date.now(),dk=s=>day(s.ts),pl=(n,a,b)=>n+' '+(n===1?a:b);
 if(A.length<10)return[{t:'Estimación',x:'Registra al menos 10 ventas (tienes '+A.length+') para generar recomendaciones con tu historial.'}];
 /* 1) Inventario: ritmo = unidades por DÍA CON VENTAS en los últimos 14 días (no se reparte entre días en que no saliste a vender) */
 const rc=A.filter(s=>s.ts>=now-14*864e5),ad=new Set(rc.map(dk)).size,few=ad<3?' (estimado con solo '+pl(ad,'día','días')+' de ventas)':'';
 S.products.forEach(p=>{const u=sum(rc.filter(s=>s.pid===p.id),s=>s.qty);
  if(u>0){const av=u/ad,left=p.stock/av;
   if(p.stock<=0)T('Dato','Sin stock de '+esc(p.name)+': vendes ~'+av.toFixed(1)+' uds por día de venta. Repón antes de salir'+few+'.');
   else if(left<3)T('Dato','Surte '+esc(p.name)+': quedan '+p.stock+' y vendes ~'+av.toFixed(1)+' uds por día de venta; alcanza para ~'+left.toFixed(1)+' días de venta'+few+'.')}
  else if(p.stock>0)T('Dato','Sin ventas de '+esc(p.name)+' en 14 días y hay '+p.stock+' en inventario: compra menos o ponlo más a la vista.')});
 /* 2) Clientes / locales (campo Cliente de cada venta) */
 const cm={};A.forEach(s=>{const c=(s.client||'').trim();if(!c)return;const k=c.toLowerCase(),q=cm[k]=cm[k]||{n:c,d:new Set(),inc:0,first:s.ts,last:s.ts};q.d.add(dk(s));q.inc+=s.total;q.first=Math.min(q.first,s.ts);q.last=Math.max(q.last,s.ts)});
 const cl=Object.values(cm).map(c=>({...c,vis:c.d.size,gap:c.d.size>1?(c.last-c.first)/864e5/(c.d.size-1):0,since:(now-c.last)/864e5}));
 const back=cl.filter(c=>c.vis>=2&&c.since>=3&&c.since>c.gap*1.5).sort((a,b)=>b.inc-a.inc).slice(0,3);
 if(back.length)T('Dato','Retoma estos clientes, llevan más sin comprar de lo habitual: '+back.map(c=>esc(c.n)+' (compra cada ~'+Math.max(1,Math.round(c.gap))+' d, llevas '+Math.round(c.since)+' d)').join('; ')+'.');
 const topc=cl.slice().sort((a,b)=>b.inc-a.inc).slice(0,3);
 if(topc.length)T('Dato','Mejores clientes/locales: '+topc.map(c=>esc(c.n)+' ('+$m(c.inc)+', '+pl(c.vis,'día','días')+')').join(', ')+'.');
 /* 3) Mejor franja de 2 horas */
 const hh=Array(24).fill(0);A.forEach(s=>hh[new Date(s.ts).getHours()]+=s.total);const tot=sum(hh,x=>x)||1;let bh=0;for(let h=0;h<23;h++)if(hh[h]+hh[h+1]>hh[bh]+hh[bh+1])bh=h;
 T('Dato','Tu mejor franja es de '+bh+':00 a '+(bh+2)+':00: '+Math.round((hh[bh]+hh[bh+1])/tot*100)+'% de tus ingresos ('+$m(hh[bh]+hh[bh+1])+'). Procura estar en tu zona fuerte antes de las '+bh+':00.');
 /* 4) Día de la semana: PROMEDIO por día con ventas (no total), mínimo 2 registros por día */
 const bdy={};A.forEach(s=>{const k=dk(s);bdy[k]=(bdy[k]||0)+s.total});
 const wd={};Object.entries(bdy).forEach(([k,v])=>{const w=new Date(k+'T12:00:00').getDay();(wd[w]=wd[w]||[]).push(v)});
 const wr=Object.entries(wd).filter(([,a])=>a.length>=2).map(([w,a])=>[DAYS[w],sum(a,x=>x)/a.length,a.length]).sort((a,b)=>b[1]-a[1]);
 if(wr.length>=2)T('Dato','Mejor día: '+wr[0][0]+' ('+$m(wr[0][1])+' promedio, '+wr[0][2]+' veces) · el más flojo: '+wr[wr.length-1][0]+' ('+$m(wr[wr.length-1][1])+').');
 else T('Estimación','Faltan datos para comparar días de la semana (se necesitan ≥2 registros del mismo día).');
 /* 5) Zonas */
 const Z=zonesX(A);
 if(Z.length){const z=Z[0];T('Dato','Zona más fuerte: '+esc(zname(z))+' — '+pl(z.n,'venta','ventas')+', '+$m(z.inc)+' ('+Math.round(z.share*100)+'% de lo vendido con ubicación), ticket promedio '+$m(z.inc/z.n)+'.'+(Z[1]?' Le sigue '+esc(zname(Z[1]))+' ('+$m(Z[1].inc)+').':''));
  const w=Z.length>=3?Z[Z.length-1]:null;if(w&&w.n>=3&&w.share<.1)T('Dato','Zona de bajo rendimiento: '+esc(zname(w))+' ('+pl(w.n,'venta','ventas')+', '+Math.round(w.share*100)+'%). Evalúa quitarla de la ruta o cambiar el horario.')}
 /* 6) Productos */
 const pm={};A.forEach(s=>{const x=pm[s.name]=pm[s.name]||{u:0,inc:0,pr:0};x.u+=s.qty;x.inc+=s.total;x.pr+=s.total-s.cost*s.qty});
 const P=Object.entries(pm).sort((a,b)=>b[1].pr-a[1].pr);
 T('Dato','Más ganancia: '+P.slice(0,3).map(([k,v])=>esc(k)+' ('+$m(v.pr)+', '+v.u+' uds)').join(', ')+'.');
 const lm=P.filter(([,v])=>v.u>=5&&v.inc>0&&v.pr/v.inc<.25).sort((a,b)=>a[1].pr/a[1].inc-b[1].pr/b[1].inc)[0];
 if(lm)T('Dato',esc(lm[0])+' deja solo '+Math.round(lm[1].pr/lm[1].inc*100)+'% de margen: revisa su precio o su costo.');

 const tw=A.filter(s=>s.ts>=now-7*864e5),tp=A.filter(s=>s.ts<now-7*864e5&&s.ts>=now-14*864e5),n1=new Set(tw.map(dk)).size,n2=new Set(tp.map(dk)).size;

 const ds=Object.entries(bdy).map(([k,v])=>({d:new Date(k+'T12:00:00'),v})),av=a=>sum(a,x=>x.v)/a.length;
 flags(new Date()).forEach(f=>{const a=ds.filter(x=>flags(x.d).includes(f)),b=ds.filter(x=>!flags(x.d).includes(f));
  if(a.length>=3&&b.length>=3)T('Dato','Días de '+f+': '+$m(av(a))+' promedio vs '+$m(av(b))+' otros días (solo cuenta días con ventas registradas).');
  else T('Estimación','Hoy es '+f+', pero aún no hay suficientes días registrados para comparar.')});
 const rd={},dd={};A.forEach(s=>{if(s.rain==null)return;const k=dk(s);(s.rain?rd:dd)[k]=((s.rain?rd:dd)[k]||0)+s.total});
 const ra=Object.values(rd),dr=Object.values(dd);
 if(ra.length>=3&&dr.length>=3)T('Dato','Días con lluvia registrada: '+$m(sum(ra,x=>x)/ra.length)+' por día vs '+$m(sum(dr,x=>x)/dr.length)+' sin lluvia.');
 if(S.wx&&S.wx.hrs&&Math.max(S.wx.next6,S.wx.prob)>=50)T('Estimación','Lluvia probable en las próximas horas (hasta '+Math.max(S.wx.next6,S.wx.prob)+'%). Ajusta tu salida o inventario.');
 const ev=S.events.filter(e=>e.date>=day(now)&&e.date<=day(now+7*864e5));
 if(ev.length)T('Estimación','Eventos próximos que registraste: '+ev.map(e=>esc(e.name)+' ('+e.date+')').join(', ')+'. No hay datos propios para medir su efecto.');

  if(l&&hav(l,q)<8&&q.t-l.t<30000)return;r.pts.push(q);if(routeLine&&map&&mapReady){routeLine.co.push([q.lng,q.lat]);const rs=map.getSource(routeLine.id);if(rs)rs.setData(lineF(routeLine.co))}r.u=Date.now();save();if(view==='route')live()},
  e=>toast('GPS: '+e.message,1),{enableHighAccuracy:true,maximumAge:5000,timeout:20000});

 if(a==='start'){if(r)return;r={id:uid(),name:'Ruta '+fdt(Date.now()),start:Date.now(),end:null,acc:0,seg:Date.now(),status:'tracking',pts:[],u:Date.now()};S.routes.push(r);S.active=r.id;track()}

 S.products.push(...ps);let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647,hrs=[10,11,12,13,17,18,18,19,20];

const MAP={products:[['id','id'],['name','name'],['price','price'],['cost','cost'],['stock','stock'],['min','min_stock'],['demo','demo'],['u','u']],
 sales:[['id','id'],['ts','ts'],['pid','product_id'],['name','product_name'],['qty','qty'],['price','price'],['cost','cost'],['total','total'],['client','client'],['notes','notes'],['pay','pay'],['lat','lat'],['lng','lng'],['rid','route_id'],['rain','rain'],['demo','demo'],['u','u']],
 routes:[['id','id'],['name','name'],['start','started'],['end','ended'],['acc','acc'],['status','status'],['u','u']],
 events:[['id','id'],['name','name'],['date','date'],['notes','notes'],['u','u']]};
let sb=null,sbKey='';
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('No se pudo cargar Supabase (¿sin conexión?)'));document.head.appendChild(s)})}
async function client(){const k=S.cfg.url+'|'+S.cfg.key;if(!S.cfg.url||!S.cfg.key)throw new Error('Falta la URL o la clave en Ajustes');
 if(/service_role/i.test(S.cfg.key))throw new Error('No uses la clave service_role');
 if(!window.supabase)await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js');
 if(!sb||sbKey!==k){sb=window.supabase.createClient(S.cfg.url,S.cfg.key);sbKey=k}return sb}
async function sync(){const c=await client(),{data:{session}}=await c.auth.getSession();if(!session)throw new Error('Inicia sesión primero');const U=session.user.id;
 /* 1) eliminaciones pendientes */
 for(const t of['sales','products','events','routes']){const ids=S.del.filter(d=>d.t===t).map(d=>d.id);if(ids.length){const{error}=await c.from(t).delete().in('id',ids);if(error)throw error}}
 S.del=[];
 /* 2) para cada tabla: traer remoto, combinar por id (gana el más reciente 'u') y subir lo local más nuevo (upsert por id → sin duplicados) */
 const arr={products:S.products,sales:S.sales,routes:S.routes,events:S.events};
 for(const t of['products','routes','sales','events']){
  const rem=[];for(let f=0;;f+=1000){const{data,error}=await c.from(t).select('*').range(f,f+999);if(error)throw error;rem.push(...data);if(data.length<1000)break}
  const rm=new Map(rem.map(r=>[r.id,r])),loc=arr[t],lm=new Map(loc.map(x=>[x.id,x]));
  rem.forEach(r=>{const o={};MAP[t].forEach(([l,k])=>o[l]=r[k]);if(t==='routes')o.pts=[];if(t!=='products'&&t!=='routes')o.demo=!!o.demo;
   const x=lm.get(r.id);if(!x){if(t==='routes')o.seg=Date.now();loc.push(o)}else if((r.u||0)>(x.u||0)){const pts=x.pts;Object.assign(x,o);if(pts)x.pts=pts}});
  const up=loc.filter(x=>{const r=rm.get(x.id);return!r||(x.u||0)>(r.u||0)}).map(x=>{const r={user_id:U};MAP[t].forEach(([l,k])=>r[k]=x[l]==null?null:x[l]);return r});
  for(let i=0;i<up.length;i+=300){const{error}=await c.from(t).upsert(up.slice(i,i+300),{onConflict:'id'});if(error)throw error}
  if(t==='routes'){ /* puntos GPS: se suben una sola vez (marca s) y se bajan los que falten */
   for(const r of S.routes){const np=r.pts.filter(p=>!p.s);for(let i=0;i<np.length;i+=500){const ch=np.slice(i,i+500),{error}=await c.from('route_points').upsert(ch.map(p=>({id:p.id,user_id:U,route_id:r.id,lat:p.lat,lng:p.lng,t:p.t})),{onConflict:'id'});if(error)throw error;ch.forEach(p=>p.s=1)}}
   const have=new Set(S.routes.flatMap(r=>r.pts.map(p=>p.id)));
   for(let f=0;;f+=1000){const{data,error}=await c.from('route_points').select('*').order('t').range(f,f+999);if(error)throw error;
    data.forEach(p=>{const r=S.routes.find(x=>x.id===p.route_id);if(r&&!have.has(p.id)){r.pts.push({id:p.id,lat:p.lat,lng:p.lng,t:p.t,s:1})}});if(data.length<1000)break}
   S.routes.forEach(r=>r.pts.sort((a,b)=>a.t-b.t))}}
 S.cfg.last=Date.now();save()}

const A={
 go:(i,b)=>{selR=null;go(b.dataset.v)},close:closeSheet,newsale:()=>saleForm(),
 rng:i=>{R.k=i;go('home')},editsale:i=>saleForm(i),
 delsale:i=>{if(!confirm('¿Borrar esta venta? Se devolverá el stock.'))return;const s=S.sales.find(x=>x.id===i),p=S.products.find(x=>s&&x.id===s.pid);if(p){p.stock+=s.qty;p.u=Date.now()}S.sales=S.sales.filter(x=>x.id!==i);S.del.push({t:'sales',id:i});save();go('sales')},
 wxref:()=>fetchWx(true),csv,rstart:()=>rAct('start'),rpause:()=>rAct('pause'),rresume:()=>rAct('resume'),rend:()=>{if(confirm('¿Finalizar el recorrido?'))rAct('end')},
 rview:i=>{selR=i;go('route')},rdel:i=>{if(!confirm('¿Borrar este recorrido?'))return;S.routes=S.routes.filter(x=>x.id!==i);S.del.push({t:'routes',id:i});save();selR=null;go('route')},
 newprod:()=>prodForm(),editprod:i=>prodForm(i),
 delprod:i=>{if(!confirm('¿Borrar producto? Las ventas pasadas se conservan.'))return;S.products=S.products.filter(x=>x.id!==i);S.del.push({t:'products',id:i});save();go('more')},
 delev:i=>{S.events=S.events.filter(x=>x.id!==i);S.del.push({t:'events',id:i});save();go('more')},
 bkup:()=>{const o=JSON.parse(JSON.stringify(S));o.cfg.key='';o.cfg.url='';dl('rutaventas_respaldo_'+day(Date.now())+'.json',JSON.stringify(o),'application/json')},
 zfly:id=>flyZone(+id),demo,undemo,sql:()=>sheet('<h3>SQL para Supabase</h3><textarea class="sql" readonly>'+esc(SQL)+'</textarea><button class="btn p" data-a="copysql">Copiar</button><button class="btn" data-a="close">Cerrar</button>'),
 copysql:()=>{const t=$('textarea.sql');t.select();navigator.clipboard?navigator.clipboard.writeText(t.value).then(()=>toast('SQL copiado')).catch(()=>toast('Copia manualmente el texto',1)):document.execCommand('copy')},
 out:async()=>{try{const c=await client();await c.auth.signOut();toast('Sesión cerrada')}catch(e){toast(e.message,1)}},
 sync:async()=>{toast('Sincronizando…');try{await sync();toast('Sincronización completada');go('more')}catch(e){toast('Error al sincronizar: '+(e.message||e),1)}}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset.id,b)});
let sub=null;document.addEventListener('click',e=>{const b=e.target.closest('button[data-m]');if(b)sub=b.dataset.m});
document.addEventListener('submit',async e=>{const f=e.target.closest('form[data-f]');if(!f)return;e.preventDefault();const d=new FormData(f),k=f.dataset.f,id=f.dataset.id;
 if(k==='sale')return saveSale(f,id);
 if(k==='prod'){const price=num(d.get('price')),cost=num(d.get('cost')),stock=parseInt(d.get('stock')),min=parseInt(d.get('min')),name=d.get('name').trim();
  if(!name||!(price>=0)||!(cost>=0)||!(stock>=0)||!(min>=0))return toast('Revisa los campos del producto',1);
  const o=id?S.products.find(x=>x.id===id):null;if(o)Object.assign(o,{name,price,cost,stock,min,u:Date.now()});else S.products.push({id:uid(),name,price,cost,stock,min,demo:false,u:Date.now()});
  save();closeSheet();toast('Producto guardado');go('more')}
 if(k==='event'){S.events.push({id:uid(),name:d.get('name').trim(),date:d.get('date'),notes:d.get('notes').trim(),u:Date.now()});save();go('more')}
 if(k==='cfg'){const lat=num(d.get('lat')),lng=num(d.get('lng'));if(!(Math.abs(lat)<=90)||!(Math.abs(lng)<=180))return toast('Coordenadas inválidas',1);
  Object.assign(S.cfg,{place:d.get('place').trim()||S.cfg.place,lat,lng,theme:d.get('theme'),url:d.get('url').trim().replace(/\/$/,''),key:d.get('key').trim()});S.wx=null;save();theme();toast('Ajustes guardados');go('more')}
 if(k==='auth'){try{const c=await client(),cr={email:d.get('email'),password:d.get('pw')};
  const r=sub==='up'?await c.auth.signUp(cr):await c.auth.signInWithPassword(cr);if(r.error)throw r.error;
  toast(sub==='up'&&!r.data.session?'Revisa tu correo para confirmar la cuenta':'Sesión iniciada')}catch(x){toast(x.message||'Error de autenticación',1)}}});
document.addEventListener('input',e=>{const f=e.target.closest('form[data-f=sale]');if(!f)return;
 if(e.target.name==='pid')f.price.value=e.target.selectedOptions[0].dataset.pr;
 $('#tot').textContent=$m((parseInt(f.qty.value)||0)*(num(f.price.value)||0))});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id==='f1'||t.id==='f2'||t.id==='f3'){F.from=$('#f1').value;F.to=$('#f2').value;F.pid=$('#f3').value;go('sales')}
 if(t.id==='r1'||t.id==='r2'){R.from=$('#r1').value;R.to=$('#r2').value;go('home')}
 if(t.id==='rest'&&t.files[0]){const fr=new FileReader();fr.onload=()=>{try{const o=JSON.parse(fr.result);if(!Array.isArray(o.sales)||!Array.isArray(o.products))throw new Error('Archivo no válido');
  if(!confirm('Esto reemplaza tus datos actuales por el respaldo. ¿Continuar?'))return;const c=S.cfg;S=Object.assign(blank(),o,{cfg:Object.assign(c,{place:o.cfg&&o.cfg.place||c.place}),active:null});S.routes.forEach(r=>{if(r.status!=='done'){r.status='done';r.end=r.end||Date.now()}});save();toast('Respaldo restaurado');go('more')}catch(x){toast('No se pudo restaurar: '+x.message,1)}};fr.readAsText(t.files[0])}});
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',theme);
const stale=()=>!S.wx||!S.wx.hrs||Date.now()-S.wx.t>9e5;
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(stale())fetchWx();else paintWx()}});
setInterval(()=>{if(document.hidden)return;if(stale())fetchWx();else paintWx()},60000);
go('home');
